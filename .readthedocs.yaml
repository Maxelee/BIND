# Read the Docs configuration for BIND
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
  - pdf

python:
  install:
    # Docs deps only. The package is deliberately NOT pip-installed here: it is
    # imported from ../src via the sys.path entry in conf.py, with torch,
    # lightning and Pylians replaced by autodoc_mock_imports. Installing it
    # would drag in Pylians, which needs compilation and fails on RTD.
    # This must stay consistent with the CONTRACT comment in docs/conf.py.
    - requirements: docs/requirements.txt
