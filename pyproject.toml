[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bind"
version = "0.3.0"
description = "BIND2: conditional flow-matching emulator that paints baryonic fields onto dark-matter-only maps (CAMELS IllustrisTNG)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Max E. Lee" }]
keywords = ["cosmology", "flow-matching", "diffusion", "CAMELS", "IllustrisTNG", "emulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "torch>=2.0",
    "lightning>=2.0",
    "torch-ema",
    "numpy",
    "pandas",
    "h5py",
    "huggingface_hub",
    # Progress bars; imported at module scope on the `import bind` path
    # (inference/{pipeline,paint,paint_stages}.py), so this is a hard dependency.
    "tqdm",
    # ks_2samp in bind.metrics and the wlemu sensitivity analysis. Imported
    # lazily inside functions, so its absence degrades rather than breaks.
    "scipy",
    # Pylians3 provides the MAS_library (CIC particle-to-grid projection) and
    # Pk_library modules. Both are imported at module scope on the `import bind`
    # path. It is the canonical pixelizer for BIND inputs.
    "Pylians",
]

[project.optional-dependencies]
dev = ["ruff==0.15.*", "pytest", "build", "tomli; python_version < '3.11'"]
# The lightcone-statistics emulator (bind.emulator).  Heavy / optional extras kept
# out of the core install: GP + MLP backends (scikit-learn), the wavelet scattering
# transform (kymatio), and the conditional normalizing-flow backend (zuko).
emulator = ["scikit-learn", "scipy", "kymatio", "zuko", "gpytorch", "pyarrow", "matplotlib"]
# fitting the WL statistics emulator (bind.wlemu_stats.fit); prediction is numpy-only
wlemu-stats-fit = ["gpytorch", "scikit-learn"]
# distributed projection of large boxes (bind-paint-project --mpi, paint_stages,
# bind.cli.lightcone_stats_mpi)
mpi = ["mpi4py"]

[project.urls]
Repository = "https://github.com/Maxelee/BIND"
Weights = "https://huggingface.co/mel2260/BIND"

[project.scripts]
bind-design = "bind.cli.design:main"
bind-science-plan = "bind.cli.science_plan:main"
bind-make-portable = "bind.cli.make_portable:main"
bind-paint = "bind.cli.paint:main"
bind-paint-project = "bind.cli.paint_project:main"
bind-truth-halos = "bind.cli.truth_halos:main"
bind-paint-generate = "bind.cli.paint_generate:main"
bind-paint-recomposite = "bind.cli.paint_recomposite:main"
bind-paint-lensplane = "bind.cli.paint_lensplane:main"
bind-paint-yplane = "bind.cli.paint_yplane:main"
bind-paint-tauplane = "bind.cli.paint_tauplane:main"
bind-lightcone-maps = "bind.cli.lightcone_maps:main"
bind-lightcone-stats = "bind.cli.lightcone_stats:main"
bind-spherical-slabs = "bind.cli.spherical_slabs:main"
bind-paired-stats = "bind.cli.paired_stats:main"
bind-generate-halos = "bind.cli.generate_halos:main"
bind-extract-halos = "bind.cli.extract_halos:main"
bind-lux-collect = "bind.cli.lux_collect:main"
bind-camels-suite = "bind.cli.camels_suite:main"
bind-emulator-stats = "bind.cli.emulator_stats:main"
bind-emulator-assemble = "bind.cli.emulator_assemble:main"
bind-emulate = "bind.cli.emulate:main"
bind-wlemu-train = "bind.wlemu.train:main"
bind-wlemu-stats = "bind.cli.wlemu_stats:main"
bind-nu-sigma0 = "bind.cli.nu_sigma0:main"
bind-paint-project-hydro = "bind.cli.paint_project_hydro:main"
bind-paint-diffuse-composite = "bind.cli.paint_diffuse_composite:main"
bind-download-weights = "bind.tools.download_weights:main"
bind-slim-checkpoint = "bind.tools.slim_checkpoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bind = ["assets/*.csv", "assets/*.txt", "assets/*.npz"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
